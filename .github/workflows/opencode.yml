name: opencode
on:
  issue_comment:
    types: [created]

jobs:
  # Job 1: The AI Agent performs the analysis/coding
  opencode-task:
    if: contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create branches/commits
      pull-requests: write
      issues: write
      id-token: write
    outputs:
      should_approve: ${{ steps.check.outputs.should_approve }}
    steps:
      - uses: actions/checkout@v6
      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/deepseek-v4-flash-free

  # Job 2: Wait for your manual approval
  manual-approval:
    needs: opencode-task
    runs-on: ubuntu-latest
    permissions:
      issues: write # Required to create the approval issue
    steps:
      - name: Await for manual approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.TOKEN }}
          approvers: YOUR_GITHUB_USERNAME # Replace with your username
          minimum-approvals: 1
          issue-title: "Manual Approval Required for OpenCode Changes"
          issue-body: "The agent has prepared changes. Please comment 'approve' or 'yes' to finalize."
